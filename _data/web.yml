uvod_basen_text: |
  Mělo to být malé klubíčko
  ukryté v kostkovaném šátku.
  Stříbrnými nitkami vyšitém.
  A vanilkou.
  A zatím je to drak,
  co se mnou spí
  každou noc
  v kořenech pelargonie.
  Zatahej za nitku
  a objeví se.
